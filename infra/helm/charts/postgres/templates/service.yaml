apiVersion: v1
kind: Service
metadata:
  name: {{ include "postgres.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None  # Headless service for StatefulSet
  ports:
  - port: {{ .Values.port }}
    targetPort: postgres
    protocol: TCP
    name: postgres
  selector:
    {{- include "postgres.selectorLabels" . | nindent 4 }}
