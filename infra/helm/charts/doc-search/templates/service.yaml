apiVersion: v1
kind: Service
metadata:
  name: {{ include "doc-search.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "doc-search.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "doc-search.selectorLabels" . | nindent 4 }}
