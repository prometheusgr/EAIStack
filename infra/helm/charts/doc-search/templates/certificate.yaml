apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "doc-search.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "doc-search.labels" . | nindent 4 }}
spec:
  secretName: {{ include "doc-search.certificateSecretName" . }}
  issuerRef:
    name: eaistack-ca-issuer
    kind: ClusterIssuer
  dnsNames:
  # In-cluster service DNS names (Decision 1: both short and fully-qualified)
  - {{ include "doc-search.fullname" . }}
  - {{ include "doc-search.fullname" . }}.{{ .Release.Namespace }}.svc
  - {{ include "doc-search.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local
  {{- if .Values.externalHostname }}
  - {{ .Values.externalHostname }}
  {{- end }}
