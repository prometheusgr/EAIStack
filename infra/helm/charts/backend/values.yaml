# Backend chart values

image:
  repository: eaistack/backend
  tag: latest
  pullPolicy: IfNotPresent

port: 8000

# Resource requests and limits
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi

# Readiness/liveness probe timings
probe:
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Pod security context: backend runs as UID 1000
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

# External hostname for backend's SANs (if exposed outside the cluster)
externalHostname: ""

# Browser-facing Keycloak admin console root (issue #40's "User Management"
# nav deep link), e.g. "https://keycloak.example.com". Empty means the link
# is omitted (see MainLayout.tsx) rather than pointed at the
# cluster-internal KEYCLOAK_URL an admin's browser cannot load. Not derived
# automatically from the keycloak chart's own externalHostname -- a
# subchart cannot see a sibling subchart's values -- so set this
# explicitly if the keycloak chart is installed with its own
# externalHostname.
keycloakConsoleUrl: ""

# OIDC client configuration
oidcClient:
  clientId: "eaistack-backend"

# Replica count
replicas: 1

# TLS is always enabled for backend (compliance requirement, Decision 1)
tls:
  enabled: true

# LLM observability (issue #4). Off by default, matching
# docker-compose.yml's TRACING_ENABLED and eaistack-umbrella's
# phoenix.enabled - set all three together to enable tracing.
tracingEnabled: false

# Data retention sweep job (CronJob)
# Runs hourly, purges expired conversations per SECURITY.md retention policy
retention:
  enabled: true
  schedule: "0 * * * *"  # Hourly
  image:
    repository: eaistack/backend
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
