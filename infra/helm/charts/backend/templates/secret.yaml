apiVersion: v1
kind: Secret
metadata:
  name: {{ include "backend.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Database connection string with TLS configuration (Decision 10)
  database-url: "postgresql://postgres:{{ .Values.global.postgresPassword }}@{{ include "postgres.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local/eaistack?sslmode=verify-full&sslrootcert=/etc/ssl/eaistack/ca.crt"
  # Keycloak OIDC client secret
  keycloak-client-secret: {{ required "global.keycloakClientSecret must be set at install time" .Values.global.keycloakClientSecret }}
  # Object storage credentials
  object-storage-access-key: {{ required "global.objectStorageAccessKey must be set at install time" .Values.global.objectStorageAccessKey }}
  object-storage-secret-key: {{ required "global.objectStorageSecretKey must be set at install time" .Values.global.objectStorageSecretKey }}
