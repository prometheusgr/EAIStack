{{- if .Values.tls.enabled }}
# Unused while tls.enabled defaults to false (see values.yaml and issue #33)
# - kept as a real template, gated on the same flag every other chart uses,
# so enabling TLS for Phoenix is a values.yaml change plus whatever native
# TLS wiring #33 adds to deployment.yaml, not a from-scratch Certificate.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "phoenix.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "phoenix.labels" . | nindent 4 }}
spec:
  secretName: {{ include "phoenix.certificateSecretName" . }}
  issuerRef:
    name: eaistack-ca-issuer
    kind: ClusterIssuer
  dnsNames:
  - {{ include "phoenix.fullname" . }}
  - {{ include "phoenix.fullname" . }}.{{ .Release.Namespace }}.svc
  - {{ include "phoenix.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local
  {{- if .Values.externalHostname }}
  - {{ .Values.externalHostname }}
  {{- end }}
{{- end }}
