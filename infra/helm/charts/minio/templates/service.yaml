apiVersion: v1
kind: Service
metadata:
  name: {{ include "minio.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "minio.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.port }}
    targetPort: minio
    protocol: TCP
    name: minio
  - port: {{ .Values.consolePort }}
    targetPort: console
    protocol: TCP
    name: console
  selector:
    {{- include "minio.selectorLabels" . | nindent 4 }}
