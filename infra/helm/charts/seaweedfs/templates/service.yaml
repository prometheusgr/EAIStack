apiVersion: v1
kind: Service
metadata:
  name: {{ include "seaweedfs.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "seaweedfs.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.port }}
    targetPort: s3
    protocol: TCP
    name: s3
  selector:
    {{- include "seaweedfs.selectorLabels" . | nindent 4 }}
