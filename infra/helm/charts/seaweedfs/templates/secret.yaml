apiVersion: v1
kind: Secret
metadata:
  name: {{ include "seaweedfs.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "seaweedfs.labels" . | nindent 4 }}
type: Opaque
stringData:
  access-key: {{ required "global.objectStorageAccessKey must be set at install time" .Values.global.objectStorageAccessKey }}
  secret-key: {{ required "global.objectStorageSecretKey must be set at install time" .Values.global.objectStorageSecretKey }}
