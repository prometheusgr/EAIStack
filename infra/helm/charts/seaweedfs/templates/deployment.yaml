apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "seaweedfs.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "seaweedfs.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "seaweedfs.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "seaweedfs.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: seaweedfs
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.port }}
          name: s3
        env:
        # SeaweedFS reads its admin S3 identity from the standard AWS
        # variables when no -s3.config file is given.
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ include "seaweedfs.secretName" . }}
              key: access-key
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "seaweedfs.secretName" . }}
              key: secret-key
        args:
        - server
        - -dir={{ .Values.storage.mountPath }}
        # Lets the volume server size its slot count from free disk: SeaweedFS
        # pre-allocates several volumes per bucket, and the default cap is easy
        # to exhaust.
        - -volume.max=0
        # The image reports anonymous cluster statistics to
        # telemetry.seaweedfs.com by default. Never in an air-gapped
        # deployment, and not appropriate for an enterprise one either.
        - -master.telemetry=false
        - -s3
        - -s3.port={{ .Values.port }}
        # Setting a cert makes the S3 port TLS-only (Decision 10).
        - -s3.cert.file=/etc/seaweedfs/tls/tls.crt
        - -s3.key.file=/etc/seaweedfs/tls/tls.key
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - name: seaweedfs-data
          mountPath: {{ .Values.storage.mountPath }}
        - name: seaweedfs-tls
          mountPath: /etc/seaweedfs/tls
          readOnly: true
        readinessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.port }}
            scheme: HTTPS
          initialDelaySeconds: {{ .Values.probe.initialDelaySeconds }}
          periodSeconds: {{ .Values.probe.periodSeconds }}
          timeoutSeconds: {{ .Values.probe.timeoutSeconds }}
          failureThreshold: {{ .Values.probe.failureThreshold }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.port }}
            scheme: HTTPS
          initialDelaySeconds: {{ .Values.probe.initialDelaySeconds }}
          periodSeconds: {{ .Values.probe.periodSeconds }}
          timeoutSeconds: {{ .Values.probe.timeoutSeconds }}
          failureThreshold: {{ .Values.probe.failureThreshold }}
      volumes:
      # Persistent storage for objects
      - name: seaweedfs-data
        persistentVolumeClaim:
          claimName: {{ include "seaweedfs.fullname" . }}-pvc
      # TLS certificate: cert-manager-issued Secret (Decision 1, Decision 10).
      # tls.crt / tls.key are used under their own names - SeaweedFS takes
      # explicit file paths, unlike MinIO's fixed public.crt/private.key layout.
      - name: seaweedfs-tls
        secret:
          secretName: {{ include "seaweedfs.certificateSecretName" . }}
          defaultMode: 0440
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "seaweedfs.fullname" . }}-pvc
  namespace: {{ .Release.Namespace }}
spec:
  accessModes: [ "ReadWriteOnce" ]
  storageClassName: {{ required "persistence.storageClassName must be set to an encrypted StorageClass - see docs/SECURITY.md" .Values.storage.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.storage.size }}
