services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eaistack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/minio_root
    command: minio server /minio_root --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:22.0.0
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/eaistack
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_SCHEME: http
      KC_PROXY: edge
      KC_HOSTNAME_STRICT_HTTPS: false
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./infra/keycloak/realm-import.json:/opt/keycloak/data/import/realm.json:ro
    command: start-dev --import-realm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  llama-server:
    # Requires a GGUF model on the host at ./models/ before starting.
    # See docs/LLM_SETUP.md for the download command.
    image: ghcr.io/ggml-org/llama.cpp:server
    ports:
      # Published on 8000 for host access (curl, a locally-run backend).
      # The containerized backend reaches it as http://llama-server:8000.
      - "8000:8000"
    volumes:
      - ./models:/models:ro
    command: >
      -m /models/mistral-7b-instruct-v0.2.Q4_K_M.gguf
      --host 0.0.0.0
      --port 8000
      --ctx-size 4096
    healthcheck:
      # Model load takes ~30s on CPU; start_period keeps the container from
      # being reported unhealthy while weights are still being read.
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    profiles:
      - llm  # Only start with --profile llm flag

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/eaistack
      MINIO_URL: http://minio:9000
      KEYCLOAK_URL: http://keycloak:8080
      # Defaults to the mocked LLM. Override to "llama-cpp" (see docs/LLM_SETUP.md)
      # to route chat through the llama-server container.
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      LLM_URL: ${LLM_URL:-http://llama-server:8000/v1}
      LLM_MODEL: ${LLM_MODEL:-mistral-7b-instruct-v0.2.Q4_K_M.gguf}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-120}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_started
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_KEYCLOAK_URL: http://localhost:8080/
      VITE_BACKEND_URL: http://localhost:8001
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - keycloak
    volumes:
      - ./frontend/src:/app/src

volumes:
  postgres_data:
  minio_data:
