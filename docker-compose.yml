services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eaistack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/minio_root
    command: minio server /minio_root --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:22.0.0
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/eaistack
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_SCHEME: http
      KC_PROXY: edge
      KC_HOSTNAME_STRICT_HTTPS: false
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./infra/keycloak/realm-import.json:/opt/keycloak/data/import/realm.json:ro
    command: start-dev --import-realm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  llama-server:
    # Requires a GGUF model on the host at ./models/ before starting.
    # See docs/LLM_SETUP.md for the download command.
    image: ghcr.io/ggml-org/llama.cpp:server
    ports:
      # Published on 8000 for host access (curl, a locally-run backend).
      # The containerized backend reaches it as http://llama-server:8000.
      - "8000:8000"
    volumes:
      - ./models:/models:ro
    command: >
      -m /models/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf
      --host 0.0.0.0
      --port 8000
      --ctx-size 4096
      --jinja
    healthcheck:
      # Model load takes ~30s on CPU; start_period keeps the container from
      # being reported unhealthy while weights are still being read.
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    profiles:
      - llm  # Only start with --profile llm flag

  embedding-server:
    # Requires a GGUF embedding model on the host at ./models/ before starting.
    # See docs/LLM_SETUP.md for the download command. Runs as a separate
    # llama-server instance/port from the chat model above, since embedding
    # and chat are different model weights loaded by different processes.
    image: ghcr.io/ggml-org/llama.cpp:server
    ports:
      # Published on 8002 for host access. The containerized backend reaches
      # it as http://embedding-server:8000.
      - "8002:8000"
    volumes:
      - ./models:/models:ro
    command: >
      -m /models/nomic-embed-text-v1.5.Q4_K_M.gguf
      --host 0.0.0.0
      --port 8000
      --embedding
      --ctx-size 8192
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    profiles:
      - llm  # Only start with --profile llm flag

  # Standalone MCP server exposing pgvector document search as an MCP tool
  # over Streamable HTTP (see mcp-servers/doc-search). Runs as its own
  # service/pod rather than in-process in the backend so it can scale and be
  # redeployed independently — see docs/ARCHITECTURE.md's "MCP Transport"
  # section for why Streamable HTTP (not stdio) is required.
  #
  # Alembic in backend/ remains the sole schema authority for knowledge_base,
  # embeddings, and system_settings — doc-search only reads those tables, so
  # it depends on `migrate` (not its own migration step) to guarantee the
  # schema already exists before it starts.
  doc-search:
    build:
      context: ./mcp-servers/doc-search
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/eaistack
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: eaistack
      # Same env-level embedding defaults as the backend (see
      # backend's EMBEDDING_PROVIDER/EMBEDDING_URL/EMBEDDING_MODEL below) —
      # an admin's runtime override via the Settings screen is read from the
      # same system_settings row by both services, so this only matters as
      # the fallback before any override is set.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fake}
      EMBEDDING_URL: ${EMBEDDING_URL:-http://embedding-server:8000/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text-v1.5.Q4_K_M.gguf}
    ports:
      # Published on 8100 for host access (curl, direct debugging). The
      # containerized backend reaches it as http://doc-search:8100/mcp.
      - "8100:8100"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    command: uvicorn app.main:app --host 0.0.0.0 --port 8100
    healthcheck:
      # /healthz is the one path BearerTokenMiddleware exempts from bearer
      # token verification (see mcp-servers/doc-search/app/server.py) — every
      # other route, including /mcp, still requires a valid Keycloak token.
      test: ["CMD", "curl", "-f", "http://localhost:8100/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Self-hosted LLM observability (issue #4): Arize Phoenix. Traces every
  # chat agent run (LLM calls, tool calls, latency, token counts) and lets an
  # operator inspect the exact prompt/response for any turn. Off by default
  # (see backend's TRACING_ENABLED below) — enabling it wires the backend's
  # OpenTelemetry exporter at this service.
  #
  # Uses Phoenix's own SQLite store on a dedicated volume, not the shared
  # `eaistack` Postgres: this repo's Postgres has no multi-database
  # provisioning mechanism (a single POSTGRES_DB), and Phoenix's trace
  # schema isn't part of this repo's Alembic-owned application schema, so
  # keeping it in a separate store keeps that boundary clean rather than
  # inventing new DB-provisioning machinery for one consumer.
  #
  # No admin-configurable retention yet (tracked in issue #32, prioritized
  # to land immediately after this slice) — traces accumulate indefinitely
  # in this volume today despite carrying the same sensitive prompt/response
  # content as conversation_threads. See docs/OBSERVABILITY.md.
  phoenix:
    image: arizephoenix/phoenix:latest
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    ports:
      # 6006: UI + OTLP HTTP trace ingest (/v1/traces). 4317: OTLP gRPC ingest
      # (unused by the backend today, which exports over HTTP, but published
      # for parity with Phoenix's documented default port pair).
      - "6006:6006"
      - "4317:4317"
    volumes:
      - phoenix_data:/mnt/data
    healthcheck:
      # Not curl: confirmed by hand against the real image that it has no
      # curl/wget binary (arizephoenix/phoenix is a from-scratch Python
      # image), only python3 - every other service's healthcheck in this
      # file uses curl, but that pattern doesn't work here.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6006/healthz', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # One-shot job: applies Alembic migrations, then exits. `backend` waits for
  # this to succeed before it starts, so the app schema always matches the
  # code it's running — no manual "did you remember to migrate?" step.
  #
  # This is a docker-compose stand-in for the Helm pre-upgrade hook Job that
  # will do the same thing in the K3s deployment (Phase 5+): a Job that runs
  # migrations to completion before the Deployment rolls out new pods.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/eaistack
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic upgrade head

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/eaistack
      MINIO_URL: http://minio:9000
      KEYCLOAK_URL: http://keycloak:8080
      # Defaults to the mocked LLM. Override to "llama-cpp" (see docs/LLM_SETUP.md)
      # to route chat through the llama-server container.
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      LLM_URL: ${LLM_URL:-http://llama-server:8000/v1}
      LLM_MODEL: ${LLM_MODEL:-Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-120}
      # Defaults to the mocked embedder. Override to "llama-cpp" (see
      # docs/LLM_SETUP.md) to route embeddings through the embedding-server container.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fake}
      EMBEDDING_URL: ${EMBEDDING_URL:-http://embedding-server:8000/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text-v1.5.Q4_K_M.gguf}
      DOC_SEARCH_MCP_URL: http://doc-search:8100/mcp
      # LLM observability (issue #4). Off by default — set to "true" to send
      # chat-agent traces to the phoenix service above. See
      # docs/OBSERVABILITY.md.
      TRACING_ENABLED: ${TRACING_ENABLED:-false}
      TRACING_OTLP_ENDPOINT: ${TRACING_OTLP_ENDPOINT:-http://phoenix:6006/v1/traces}
      # POST /api/auth/token's rate limiter (issue #25) is keyed by client
      # IP, and the docker-compose stack is what both local e2e runs and
      # CI's e2e-tests job exercise -- every caller's IP-address view of
      # this backend is the same Docker network address, so real logins
      # sum into one shared bucket. The production default (capacity 10,
      # refill 10/min, see app/core/config.py) is sized for real users
      # behind real distinct IPs, not this. Raised here, not in the
      # backend's own default, since a real deployment should keep the
      # tighter budget.
      #
      # Issue #53's real fix (tests/e2e/auth.setup.ts + playwright.config.ts's
      # 'setup'/'chromium' project split) removed most e2e logins from this
      # bucket entirely: only the 3 spec files that test the login/logout
      # flow itself (auth.spec.ts, login-logout-complete.spec.ts,
      # no-infinite-loop.spec.ts) still call POST /api/auth/token for real,
      # roughly a dozen logins per full suite run rather than ~36. This
      # override is kept, at a lower value than the original stopgap, as
      # headroom for that smaller remaining footprint plus normal manual
      # dev-loop logins -- not because the shared-bucket problem persists.
      RATE_LIMIT_AUTH_CAPACITY: ${RATE_LIMIT_AUTH_CAPACITY:-25}
      RATE_LIMIT_AUTH_REFILL_PER_MINUTE: ${RATE_LIMIT_AUTH_REFILL_PER_MINUTE:-25}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      doc-search:
        condition: service_healthy
      phoenix:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_KEYCLOAK_URL: http://localhost:8080/
      VITE_BACKEND_URL: http://localhost:8001
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - keycloak
    volumes:
      - ./frontend/src:/app/src

volumes:
  postgres_data:
  minio_data:
  phoenix_data:
