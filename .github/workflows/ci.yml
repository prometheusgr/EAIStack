name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eaistack_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          pip install -e ".[dev]"

      - name: Run backend unit tests
        working-directory: ./backend
        run: pytest tests/unit/ -v --cov=app --cov-report=term-missing
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eaistack_test

      - name: Run linting
        working-directory: ./backend
        run: |
          ruff check .
          black --check .

      - name: Run type checking
        working-directory: ./backend
        run: mypy app/

      - name: Lint time injection pattern
        working-directory: ./backend
        run: python tools/lint_time_injection.py

      - name: Lint edge-case truthiness
        working-directory: ./backend
        run: python tools/lint_edge_case_truthiness.py

      - name: Lint append-only repositories
        working-directory: ./backend
        run: python tools/lint_repositories.py

  doc-search-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install doc-search dependencies
        working-directory: ./mcp-servers/doc-search
        run: |
          pip install -e ".[dev]"

      # Unit tests only: tests/integration/ needs Docker/testcontainers for real
      # Postgres and is non-gating, matching the backend's gating philosophy.
      - name: Run doc-search unit tests
        working-directory: ./mcp-servers/doc-search
        run: pytest tests/unit/ -v --cov=app --cov-report=term-missing

      - name: Run linting
        working-directory: ./mcp-servers/doc-search
        run: |
          ruff check .
          black --check .

      - name: Run type checking
        working-directory: ./mcp-servers/doc-search
        run: mypy app/

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test

      - name: Run linting
        working-directory: ./frontend
        run: npm run lint

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  infra-validation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install infra test dependencies
        run: pip install pytest pyyaml

      - name: Lint Helm charts
        run: |
          umbrella_globals="infra/helm/charts/eaistack-umbrella/values.yaml"
          for chart in infra/helm/charts/*; do
            if [ -f "$chart/Chart.yaml" ]; then
              if [ "$chart" = "infra/helm/charts/eaistack-umbrella" ]; then
                helm lint "$chart"
              else
                # Subcharts reference .Values.global.* (postgresPassword,
                # keycloakClientSecret, etc.), which only exist when the
                # umbrella supplies them at install time. Standalone `helm
                # lint` with no values leaves .Values.global nil, so
                # `required`/direct-reference templates panic instead of
                # linting. Layer in the umbrella's own values.yaml so lint
                # sees the same globals a real install would.
                helm lint "$chart" -f "$umbrella_globals"
              fi
            fi
          done

      - name: Run infra tests
        run: pytest infra/tests/ -v

  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # No --profile llm: LLM_PROVIDER/EMBEDDING_PROVIDER default to "fake"
      # (see docker-compose.yml), so llama-server/embedding-server are neither
      # started nor needed. The `frontend` service is skipped too — Playwright
      # runs its own dev server against this stack (see webServer in
      # playwright.config.ts) rather than testing the compose-built frontend
      # image.
      - name: Start dev stack
        run: docker-compose up -d postgres minio keycloak doc-search migrate backend

      - name: Wait for doc-search
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8100/healthz > /dev/null; then
              echo "doc-search is up"
              exit 0
            fi
            sleep 2
          done
          echo "doc-search did not become ready in time" >&2
          docker-compose logs doc-search
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      # global-setup.ts waits for Keycloak and the backend before any spec
      # runs; doc-search readiness is checked above since global-setup.ts
      # only covers the services Playwright specs talk to directly.
      - name: Run e2e tests
        working-directory: ./frontend
        run: npx playwright test tests/e2e/

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Show container logs on failure
        if: failure()
        run: docker-compose logs

      - name: Stop dev stack
        if: always()
        run: docker-compose down -v
